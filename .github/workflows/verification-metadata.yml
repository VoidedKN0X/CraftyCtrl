name: Dependency verification metadata

# Run by hand after a dependency or Gradle plugin changes. It writes gradle/verification-metadata.xml
# (SHA-256 of every library and plugin the build downloads; entries already in the file are kept) and prints it to the log, gzipped and
# base64-encoded between the BEGIN/END markers. Decode it, check the diff and commit it in the same push.
on:
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true

      - name: Write verification metadata
        # No secrets here: the release build is signed with the debug key in this job. Only the downloads
        # matter; nothing from this job is published.
        env:
          CRAFTY_ALLOW_DEBUG_SIGNING: "true"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --write-verification-metadata sha256 assembleDebug assembleRelease

      - name: Print the file
        run: |
          echo "----- BEGIN verification-metadata.xml.gz.b64 -----"
          gzip -9c gradle/verification-metadata.xml | base64 -w 0
          echo
          echo "----- END verification-metadata.xml.gz.b64 -----"
