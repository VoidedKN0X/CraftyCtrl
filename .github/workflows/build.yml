name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a stable signing key so new builds install over old ones.
      # Without these secrets the APK is signed with a throwaway debug key.
      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CRAFTY_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Geist and Geist Mono (SIL Open Font License) from the Google Fonts repository.
      - name: Fetch fonts
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL --retry 3 -o app/src/main/res/font/geist.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/geist/Geist%5Bwght%5D.ttf"
          curl -fsSL --retry 3 -o app/src/main/res/font/geist_mono.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/geistmono/GeistMono%5Bwght%5D.ttf"

      - name: Build release APK
        env:
          CRAFTY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CRAFTY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CRAFTY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface compiler errors as annotations so they show on the run summary.
            grep -E -A4 "^e: |What went wrong" build.log | grep -v "^> Task" | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi
          mv app/build/outputs/apk/release/app-release.apk crafty-remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: crafty-remote-apk
          path: crafty-remote.apk

      # Publishes a release for the version in app/build.gradle.kts the first time it's built,
      # with that version's notes from CHANGELOG.md. Pushes that don't bump the version only
      # produce the workflow artifact above, so published releases never change underneath you.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          tag="v$version"
          # Retire the old rolling test build.
          gh release delete latest-test --cleanup-tag --yes 2>/dev/null || true
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump versionName to publish a new one."
            exit 0
          fi
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi
          cp crafty-remote.apk "crafty-remote-$version.apk"
          gh release create "$tag" "crafty-remote-$version.apk" \
            --target "$GITHUB_SHA" \
            --title "Crafty Remote $version" \
            --notes-file notes.md \
            --latest
