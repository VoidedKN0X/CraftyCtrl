name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing by default; each job gets only what it needs (the release job alone can write).
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_signed: ${{ steps.signature.outputs.release_signed }}
    steps:
      # Third-party actions are pinned to exact commits (the comment shows the version).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        # Refuses a gradle-wrapper.jar that isn't an official Gradle release.
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # The stable signing key, so new builds install over old ones. Pushes fail without it
      # (Gradle also refuses to debug-sign on CI); only pull requests, which never publish,
      # may build with a throwaway debug key.
      # The secret is only given to this step, not to the whole job.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CRAFTY_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=1" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::warning title=Unsigned build::No signing secrets for this pull request - APK is signed with the debug key and won't be published"
            echo "CRAFTY_ALLOW_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "::error title=Signing key missing::KEYSTORE_BASE64 secret is not set - refusing to build a debug-signed release"
            exit 1
          fi

      - name: Build release APK
        env:
          CRAFTY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # The alias isn't secret: keep it as a repository *variable* so it isn't masked
          # (as ***) in logs. Falls back to the old KEY_ALIAS secret if no variable is set.
          CRAFTY_KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
          CRAFTY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface compiler errors as annotations so they show on the run summary.
            grep -E -A4 "^e: |What went wrong" build.log | grep -v "^> Task" | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi
          mv app/build/outputs/apk/release/app-release.apk craftyctrl.apk

      - name: Google-free dependency audit
        run: |
          # Nothing from Google Play services, Firebase, ML Kit, Play Core or Tink may end up in the app.
          # Runs while the keystore path is still set: the build refuses to configure a release on CI without it.
          if ! ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > deps.txt 2> deps-err.txt; then
            grep -E 'What went wrong|Exception|error' -A 3 deps-err.txt | head -20 | while IFS= read -r line; do echo "::error title=Dependency audit::${line}"; done
            exit 1
          fi
          if grep -nE 'com\.google\.(android\.gms|firebase|mlkit|android\.play|crypto\.tink)' deps.txt; then
            grep -nE 'com\.google\.(android\.gms|firebase|mlkit|android\.play|crypto\.tink)' deps.txt | head -20 | while IFS= read -r line; do echo "::error title=Google dependency::${line}"; done
            exit 1
          fi
          echo "::notice title=Google-free::No Google Play services, Firebase, ML Kit, Play Core or Tink in the release dependencies"

      # Remove the key as soon as signing is done, even if the build failed,
      # so no later step (or action) can read it.
      - name: Delete signing key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          echo "CRAFTY_KEYSTORE_PATH=" >> "$GITHUB_ENV"

      - name: Check signature
        id: signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          CERT=$("$APKSIGNER" verify --print-certs craftyctrl.apk | grep -m1 "certificate DN" | sed 's/^[^:]*: //')
          SHA=$("$APKSIGNER" verify --print-certs craftyctrl.apk | grep -m1 "SHA-256" | sed 's/^.*: //')
          echo "Signed by: $CERT"
          if [ "$RELEASE_SIGNED" = "1" ] && echo "$CERT" | grep -q "Android Debug"; then
            echo "::error title=Signing failed::Secrets are set but the APK is debug-signed - check the key alias and passwords"
            exit 1
          fi
          if [ "$RELEASE_SIGNED" = "1" ] && ! echo "$CERT" | grep -q "Android Debug"; then
            echo "release_signed=1" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice title=Signed APK::craftyctrl.apk signed by $CERT (SHA-256 $SHA)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: craftyctrl-apk
          path: craftyctrl.apk
          if-no-files-found: error

  # Publishes a release for the version in app/build.gradle.kts the first time it's built,
  # with that version's notes from CHANGELOG.md. Pushes that don't bump the version only
  # produce the workflow artifact above, so published releases never change underneath you.
  # Runs as a separate job with no access to the signing secrets; it only gets the finished APK.
  release:
    needs: build
    # Only release-signed APKs are ever published.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.release_signed == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and its tag
      id-token: write      # sign the build provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: craftyctrl-apk

      - name: Prepare release
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          tag="v$version"
          # Retire the old rolling test build.
          gh release delete latest-test --cleanup-tag --yes 2>/dev/null || true
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump versionName to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi
          apk="craftyctrl-$version.apk"
          cp craftyctrl.apk "$apk"
          # The APK's SHA-256, so a download can be checked against it.
          printf '\nSHA-256: `%s`  %s\n' "$(sha256sum "$apk" | cut -d' ' -f1)" "$apk" >> notes.md
          cat notes.md
          {
            echo "publish=true"
            echo "version=$version"
            echo "tag=$tag"
            echo "apk=$apk"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        # Proves the APK was built by this workflow from the tagged commit:
        # gh attestation verify <apk> -R VoidedKN0X/CraftyCtrl
        if: steps.prep.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: craftyctrl-*.apk

      - name: Publish release
        if: steps.prep.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.prep.outputs.version }}
          TAG: ${{ steps.prep.outputs.tag }}
          APK: ${{ steps.prep.outputs.apk }}
        run: |
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "CraftyCtrl $VERSION" \
            --notes-file notes.md \
            --latest
