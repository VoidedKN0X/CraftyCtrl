name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing by default; each job gets only what it needs (the release job alone can write).
permissions: {}

env:
  # SHA-256 of CraftyCtrl's release signing certificate, the one in SECURITY.md and README.md
  # (lower case, no colons). The sign job refuses to hand on an APK signed with anything else.
  EXPECTED_CERT_SHA256: ad45501c0cc0f7e9ca68f7a771994996407e50deb85a2ab859208fdad360cb57

jobs:
  # Builds the release APK UNSIGNED. This job runs Gradle, and with it every plugin, dependency and
  # build script, so it gets no secrets at all: the signing key only exists in the sign job below.
  # Pull requests stop here: they build and are checked, but nothing is signed or published.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # app/build.gradle.kts: build the release without a signing config (app-release-unsigned.apk).
      UNSIGNED_RELEASE: "true"
    outputs:
      apk_sha256: ${{ steps.pack.outputs.apk_sha256 }}
    steps:
      # Third-party actions are pinned to exact commits (the comment shows the version).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the documented signing certificate
        # The fingerprint the sign job enforces must be the one users are told to check.
        run: |
          colons=$(echo "$EXPECTED_CERT_SHA256" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          for f in SECURITY.md README.md; do
            if ! grep -qF "$colons" "$f"; then
              echo "::error title=Fingerprint mismatch::EXPECTED_CERT_SHA256 in build.yml is not the fingerprint in $f"
              exit 1
            fi
          done
          echo "build.yml, SECURITY.md and README.md agree on $colons"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        # Refuses a gradle-wrapper.jar that isn't an official Gradle release.
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # No Gradle cache: every build downloads its dependencies fresh and checks them against
          # gradle/verification-metadata.xml. A cache saved by one run (also by a failed one) was
          # restored by every later run, so one bad download kept failing builds until the caches
          # were deleted by hand; and a release must not be built from files an earlier run left behind.
          cache-disabled: true

      - name: Build release APK (unsigned)
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface compiler errors as annotations so they show on the run summary.
            grep -E -A4 "^e: |What went wrong" build.log | grep -v "^> Task" | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi

      - name: Google-free dependency audit
        run: |
          # Nothing from Google Play services, Firebase, ML Kit, Play Core or Tink may end up in the app.
          # UNSIGNED_RELEASE=true (job env) lets Gradle configure the release without a key here too.
          if ! ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > deps.txt 2> deps-err.txt; then
            grep -E 'What went wrong|Exception|error' -A 3 deps-err.txt | head -20 | while IFS= read -r line; do echo "::error title=Dependency audit::${line}"; done
            exit 1
          fi
          if grep -nE 'com\.google\.(android\.gms|firebase|mlkit|android\.play|crypto\.tink)' deps.txt; then
            grep -nE 'com\.google\.(android\.gms|firebase|mlkit|android\.play|crypto\.tink)' deps.txt | head -20 | while IFS= read -r line; do echo "::error title=Google dependency::${line}"; done
            exit 1
          fi
          echo "::notice title=Google-free::No Google Play services, Firebase, ML Kit, Play Core or Tink in the release dependencies"

      - name: Collect the unsigned APK
        id: pack
        run: |
          # Exactly one APK, and it must be the unsigned one: this job has no key to sign with.
          set -- app/build/outputs/apk/release/*.apk
          if [ "$#" -ne 1 ] || [ "$(basename "$1")" != "app-release-unsigned.apk" ]; then
            echo "::error title=Unexpected build output::Expected only app-release-unsigned.apk, found: $*"
            exit 1
          fi
          mkdir -p out
          cp "$1" out/craftyctrl-unsigned.apk
          sum=$(sha256sum out/craftyctrl-unsigned.apk | cut -d' ' -f1)
          echo "apk_sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "Unsigned APK SHA-256: $sum"
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Not installable: Android refuses an unsigned APK. The signed one is craftyctrl-apk.
          name: craftyctrl-unsigned-apk
          path: out/*.apk
          if-no-files-found: error

  # Signs the APK the build job made. The only job that sees the release key, and it runs no code
  # from this repo: no checkout, no Gradle, only zipalign and apksigner from the runner's Android SDK.
  # The stable signing key makes new builds install over old ones. Pushes fail here without it;
  # pull requests, which never publish, are not signed at all.
  sign:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}   # no token rights at all; artifacts of this run need none
    outputs:
      release_signed: ${{ steps.sign.outputs.release_signed }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: craftyctrl-unsigned-apk
          path: unsigned

      - name: Sign the APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # The alias isn't secret: keep it as a repository *variable* so it isn't masked
          # (as ***) in logs. Falls back to the old KEY_ALIAS secret if no variable is set.
          KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
          BUILT_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=Signing key missing::KEYSTORE_BASE64 secret is not set - refusing to publish an APK that isn't signed with the release key"
            exit 1
          fi
          in="unsigned/craftyctrl-unsigned.apk"
          # The file the build job made, byte for byte.
          echo "$BUILT_SHA256  $in" | sha256sum -c -

          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "Android build-tools: $tools"
          mkdir -p work out
          # Gradle already aligns the APK; align only if it isn't (signing must come after aligning).
          if "${tools}zipalign" -c -P 16 4 "$in"; then
            cp "$in" work/aligned.apk
          else
            "${tools}zipalign" -P 16 -f 4 "$in" work/aligned.apk
          fi

          umask 077
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          # The same schemes the Android Gradle plugin used for these releases (minSdk 35): APK
          # Signature Scheme v2 only. Passwords are read from the environment, never the command line.
          "${tools}apksigner" sign \
            --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled false --v4-signing-enabled false \
            --out out/craftyctrl.apk work/aligned.apk
          rm -f "$ks"
          echo "release_signed=true" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check release signature
        run: |
          set -euo pipefail
          # The APK must be signed with CraftyCtrl's release key, or phones won't accept it as an update.
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          apk="out/craftyctrl.apk"
          "${tools}apksigner" verify --verbose --print-certs "$apk" | tee signer.txt
          signers=$(grep -c 'certificate SHA-256 digest: ' signer.txt || true)
          actual=$(grep -m1 -oP 'certificate SHA-256 digest: \K[0-9a-f]+' signer.txt || true)
          if [ "$signers" != "1" ] || [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error title=Wrong signing key::$apk has $signers signer(s), first ${actual:-none}; expected only the CraftyCtrl release key $EXPECTED_CERT_SHA256"
            exit 1
          fi
          if ! grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signer.txt; then
            echo "::error title=Not v2-signed::$apk has no valid APK Signature Scheme v2 signature"
            exit 1
          fi
          "${tools}zipalign" -c -P 16 4 "$apk"
          # Signing must not have changed anything inside the APK: same files, same contents, same order.
          python3 - unsigned/craftyctrl-unsigned.apk "$apk" <<'PY'
          import sys, zipfile
          a, b = ([(i.filename, i.CRC, i.file_size, i.compress_type) for i in zipfile.ZipFile(p).infolist()] for p in sys.argv[1:3])
          if a != b:
              sys.exit("::error title=APK changed while signing::The signed APK's contents differ from the APK the build job made")
          print(f"Signed APK has the same {len(a)} files as the build job's APK.")
          PY
          echo "::notice title=Signed APK::craftyctrl.apk signed with the CraftyCtrl release key ($actual)"
          sha256sum "$apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # One file, craftyctrl.apk, at the top of the artifact, as the release job expects.
          name: craftyctrl-apk
          path: out/craftyctrl.apk
          if-no-files-found: error

  # Publishes a release for the version in app/build.gradle.kts the first time it's built,
  # with that version's notes from CHANGELOG.md. Pushes that don't bump the version only
  # produce the workflow artifact above, so published releases never change underneath you.
  # Runs as a separate job with no access to the signing secrets; it only gets the finished APK.
  release:
    needs: [build, sign]
    # Only release-signed APKs are ever published.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.sign.outputs.release_signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and its tag
      id-token: write      # sign the build provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: craftyctrl-apk

      - name: Prepare release
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          tag="v$version"
          # Retire the old rolling test build.
          gh release delete latest-test --cleanup-tag --yes 2>/dev/null || true
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump versionName to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi
          apk="craftyctrl-$version.apk"
          cp craftyctrl.apk "$apk"
          # The APK's SHA-256, so a download can be checked against it.
          printf '\nSHA-256: `%s`  %s\n' "$(sha256sum "$apk" | cut -d' ' -f1)" "$apk" >> notes.md
          cat notes.md
          {
            echo "publish=true"
            echo "version=$version"
            echo "tag=$tag"
            echo "apk=$apk"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        # Proves the APK was built by this workflow from the tagged commit:
        # gh attestation verify <apk> -R VoidedKN0X/CraftyCtrl
        if: steps.prep.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: craftyctrl-*.apk

      - name: Publish release
        if: steps.prep.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.prep.outputs.version }}
          TAG: ${{ steps.prep.outputs.tag }}
          APK: ${{ steps.prep.outputs.apk }}
        run: |
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "CraftyCtrl $VERSION" \
            --notes-file notes.md \
            --latest
