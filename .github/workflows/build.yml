name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a stable signing key so new builds install over old ones.
      # Without these secrets the APK is signed with a throwaway debug key.
      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CRAFTY_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          CRAFTY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CRAFTY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CRAFTY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface compiler errors as annotations so they show on the run summary.
            grep -E "^e: |What went wrong|^> " build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi
          mv app/build/outputs/apk/release/app-release.apk crafty-remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: crafty-remote-apk
          path: crafty-remote.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: crafty-remote.apk

      # Rolling test build: every push to main replaces the "latest-test" pre-release.
      - name: Publish latest test build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-test --cleanup-tag --yes || true
          gh release create latest-test crafty-remote.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest test build" \
            --notes "Built from ${GITHUB_SHA::7}. Download crafty-remote.apk on your phone and install it."
